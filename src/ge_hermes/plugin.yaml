name: hermes-graph-engineering
version: "2.0.0"
description: Task/execution graphs with dependencies, gates, contracts, durable state and verification. Independent community project; not affiliated with, endorsed by, or sponsored by Nous Research.
author: hermes-graph-engineering contributors
kind: standalone
license: MIT
requires_hermes: ">=0.21"
provides_tools:
  - ge_graph
tags:
  - orchestration
  - planning
  - verification
config_schema:
  require_plan_approval:
    type: bool
    default: true
    description: Require an operator approval of the plan before a run executes.
  disabled_executors:
    type: list
    default: []
    description: Executor names (builtin, agent) that must not run.
  max_steps:
    type: int
    default: 500
    description: Maximum node attempts started per run or resume call.
  autonomous_agent_execution:
    type: bool
    default: false
    description: Let the running Hermes host execute waiting agent nodes and submit their results, one node at a time. Off keeps manual submission.
  autonomous_node_timeout_seconds:
    type: int
    default: 3600
    description: Upper bound for one autonomous agent node before the host worker is cancelled.
  autonomous_call_budget_seconds:
    type: int
    default: 300
    description: Stop starting further agent nodes in one run/resume call after this many seconds so the call returns before the host's tool-call deadline; resume continues.
  autopilot_auto_approve_max_risk:
    type: str
    default: LOCAL_EXEC
    description: Highest risk class the autopilot approves without an operator (READ_ONLY, WORKSPACE_WRITE, LOCAL_EXEC or NETWORK).
  autopilot_deny_risks:
    type: list
    default: [DESTRUCTIVE]
    description: Risk classes the autopilot never executes, not even after an operator approval.
  autopilot_max_attempts:
    type: int
    default: 30
    description: Node attempts per autopilot run.
  autopilot_max_repairs:
    type: int
    default: 6
    description: Repairs per autopilot run.
  autopilot_max_replans:
    type: int
    default: 2
    description: Plan revisions per autopilot run.
  autopilot_max_runtime_seconds:
    type: int
    default: 14400
    description: Wall-clock limit of an autopilot run since its start.
  autopilot_max_cost:
    type: number
    default: null
    description: Limit on the host-reported cost of an autopilot run (null means no limit).
  autopilot_continue_turns:
    type: bool
    default: true
    description: Continue an unfinished autopilot run in a new agent turn automatically through the public inject_message API.
  workspace_root:
    type: str
    default: null
    description: Directory autopilot runs work in and check evidence against (default is the Hermes working directory).
